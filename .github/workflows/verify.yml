name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test deps
        run: python -m pip install pytest

      - name: Skill package integrity
        run: python verify_skill.py

      - name: Self-test suite
        run: python -m unittest discover -s tests -v

      # W6 (PLAN): the JS harness is part of the gate — syntax checks are not
      # tests. Node matrix alongside Python; run from the skill payload root.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Audit selftest + mutation sweep (node, required)
        run: |
          node vibeweaver/scripts/audit_selftest.mjs
          node vibeweaver/scripts/mutation_sweep.mjs

      - name: Plugin compat harness (node, no quarantine)
        run: node tests/plugin_compat_test.mjs

      - name: Mini checker gate harness
        run: node tests/mini_gate_test.mjs

      - name: Trust-floor fixtures (checker pin / evidence lock / bootstrap / state)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/gate_trust/run.sh
          bash tests/gate_trust/cache_invalidation.sh
          bash tests/gate_trust/evidence_integrity/run.sh
          node tests/bootstrap_test.mjs
          node tests/state_bounds_test.mjs

      - name: Clean-clone self check
        shell: bash
        run: bash tests/self_check.sh

      - name: Doc claims parity (README counts vs harness runs)
        run: python check_doc_counts.py

      - name: Claim-binder + sync-control vectors
        run: |
          python tests/test_check_doc_counts.py
          python tests/test_sync_skill.py

      - name: Mini installers (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call vibeweaver-mini\install.bat
          if errorlevel 1 exit /b 1
          mkdir "%TEMP%\vw-mini-proj"
          call vibeweaver-mini\scripts\setup_project.bat "%TEMP%\vw-mini-proj"
          if not exist "%TEMP%\vw-mini-proj\vw_check.py" exit /b 1
          if not exist "%TEMP%\vw-mini-proj\script\check.sh" exit /b 1
