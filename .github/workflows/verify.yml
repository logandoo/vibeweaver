name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test deps
        run: python -m pip install pytest

      - name: Skill package integrity
        run: python verify_skill.py

      - name: Self-test suite
        run: python -m unittest discover -s tests -v

      # W6 (PLAN): the JS harness is part of the gate — syntax checks are not
      # tests. Node matrix alongside Python; run from the skill payload root.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Audit selftest + mutation sweep (node, required)
        run: |
          node vibeweaver/scripts/audit_selftest.mjs
          node vibeweaver/scripts/mutation_sweep.mjs

      - name: Plugin compat harness (node, known E3/G9 allowed)
        run: node tests/plugin_compat_test.mjs --allow-known
